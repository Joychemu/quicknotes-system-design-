<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>
        
        <!-- Load Section -->
        <section class="load-section">
            <button id="load-btn">Load notes</button>
        </section>

        <!-- Status Message -->
        <p id="status" aria-live="polite"></p>

        <!-- Create Form -->
        <section class="form-section">
            <h2>Create a New Note</h2>
            <form id="note-form">
                <div class="field-group">
                    <label for="title-input">Title (required, max 100 chars):</label>
                    <input type="text" id="title-input" maxlength="100" required>
                </div>
                <div class="field-group">
                    <label for="body-input">Body (optional):</label>
                    <textarea id="body-input" rows="4"></textarea>
                </div>
                <button type="submit" id="submit-btn">Add Note</button>
            </form>
        </section>

        <!-- Notes Display List -->
        <section class="list-section">
            <h2>Notes</h2>
            <ul id="notes-list">
                <!-- Populated dynamically -->
            </ul>
        </section>
    </main>
</body>
</html>
